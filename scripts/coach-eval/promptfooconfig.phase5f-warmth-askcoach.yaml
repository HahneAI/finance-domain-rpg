description: >
  Phase 5f (docs/TODO.md §2.L) — Warmth/Formality (rubric Axis 5) elicitation, askcoach.
  One model, no repeat, budget-planned discovery pass. Only warmth is overridden;
  length/directness/metaphor/grounding held constant. Calm scenario chosen on
  purpose so urgency doesn't confound warmth. Includes ONE grounding probe at Warmth 4 (no real history in the data).

providers:
  - id: anthropic:messages:claude-haiku-4-5
    label: haiku
    config:
      apiKeyEnvar: AI_ADMIN_COACH_TEST_KEY
      max_tokens: 1536

prompts:
  - id: file://prompts/askCoachComposed.js
    label: ask-coach-composed

defaultTest:
  vars:
    userMessage: "How's my week looking?"
    severity: "default"

tests:
  - description: "Elicit Warmth 1 (Clinical)"
    vars:
      calibrationInstruction: >
        CALIBRATION OVERRIDE (test harness only — for this one response only): produce output scoring exactly 1 on Warmth/Formality per docs/coach-personality-rubric.md Axis 5 — "Clinical: report voice; no acknowledgement of the person." Change ONLY warmth/formality: keep this mode's normal length, directness, grounding, one-concrete-action, no-Markdown and metaphor rules exactly as above.

  - description: "Elicit Warmth 2 (Professional)"
    vars:
      calibrationInstruction: >
        CALIBRATION OVERRIDE (test harness only — for this one response only): produce output scoring exactly 2 on Warmth/Formality per docs/coach-personality-rubric.md Axis 5 — "Professional: courteous, neutral." Change ONLY warmth/formality: keep this mode's normal length, directness, grounding, one-concrete-action, no-Markdown and metaphor rules exactly as above.

  - description: "PROBE Warmth 4 (Personal) — no real shared history in context; checks for invented closeness"
    vars:
      calibrationInstruction: >
        CALIBRATION OVERRIDE (test harness only — for this one response only): produce output scoring exactly 4 on Warmth/Formality per docs/coach-personality-rubric.md Axis 5 — "Personal: names the user's specific progress or effort; light encouragement." Change ONLY warmth/formality: keep this mode's normal length, directness, grounding, one-concrete-action, no-Markdown and metaphor rules exactly as above. Grounding still applies in full: only reference facts present in the data above.

