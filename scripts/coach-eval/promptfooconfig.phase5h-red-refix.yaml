description: >
  Phase 5h (2026-10-08) Net Worth RED re-fix verify: addendum now bans all figurative
  language (not just boxing) and restates the 2-3 sentence rule. Red only, natural, --repeat 3.
  Original description follows.
  Phase 5 (docs/TODO.md §2.L), first slice — Net Worth Trigger's three
  shipped tiers (buildNetWorthSystemPrompt in coachPrompts.js). This is the
  DESIGNED counterpart to Phase 4's accidental finding: Red's addendum
  explicitly instructs dropping metaphor for urgency, unlike Ask Coach's
  severity flexing, which happened with no instruction for it at all. Real
  question this answers: does the shipped, intentional design actually work?

  Deliberately NO calibration override — sampling the real, shipped prompts
  as they actually ship (claude-haiku-4-5, matching CoachNetWorthCard.jsx's
  hardcoded model choice), not a forced extreme. Per the standing instruction
  from Phase 4, both axes get checked: Axis 1 (Metaphor Intensity) — does Red
  really land near 1 while Amber/Green land near 3, as the rubric's existing
  (never-live-verified) targets claim — and Axis 2 (Urgency Escalation) —
  does Red's shape differ from Amber/Green the way severity predicts.

  First pass: 3 calls, no repeat. Repeat-verify only the tiers whose result
  looks interesting enough to be worth confirming, not all three by default.

providers:
  - id: anthropic:messages:claude-haiku-4-5
    label: haiku
    config:
      apiKeyEnvar: AI_ADMIN_COACH_TEST_KEY
      max_tokens: 1024

prompts:
  - id: file://prompts/netWorthTrigger.js
    label: net-worth-trigger

tests:
  - description: "Red tier — natural, after the all-figurative-language ban"
    vars:
      tier: red
